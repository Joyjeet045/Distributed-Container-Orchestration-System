name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Unit Tests
        run: go test -mod=mod ./internal/... -run "Test" -count=1

  integration:
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Build
        run: go build -mod=mod ./...
      - name: API/Service Integration Tests
        run: go test -mod=mod ./internal/api ./internal/service ./internal/worker -count=1

  e2e:
    runs-on: ubuntu-latest
    needs: integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: End-to-End Tests
        run: go test -mod=mod ./internal/e2e -count=1
