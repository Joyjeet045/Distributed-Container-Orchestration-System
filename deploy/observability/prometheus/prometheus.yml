global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: orchestrator-control-plane
    metrics_path: /metrics
    static_configs:
      - targets: ["api-server:8080"]

  - job_name: orchestrator-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - worker-1:8081
          - worker-2:8081
